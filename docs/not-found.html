<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: #ffffff;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            color: #475569;
            margin-bottom: 20px;
        }

        .code {
            background: #0f172a;
            color: #38bdf8;
            padding: 10px 15px;
            border-radius: 8px;
            display: inline-block;
            font-family: monospace;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        a:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <p>The requested documentation page could not be found.</p>
    <p>
        The page may have been removed, renamed, or does not exist.
    </p>

    <a href="/docs">Go to Welcome</a>
</div>

</body>
</html>

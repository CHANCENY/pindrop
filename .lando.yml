name: slots
recipe: lamp

config:
  webroot: .
  php: '8.4'

services:
  appserver:
    overrides:
      ports:
        - "8000:8000"
    ports:
      - "8800:80"
    build_as_root:
      - apt-get update -y
      - docker-php-ext-install sockets

  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database
    port: 8081

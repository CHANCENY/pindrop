moderator:
  can_edit_any_page:
    title: 'Can edit any page'
    description: 'Allows the user to edit any wiki page, regardless of ownership.'
  can_delete_own_page:
    title: 'Can delete own page'
    description: 'Allows the user to delete pages they have created.'
  can_administer_wiki:
    title: 'Can administer wiki'
    description: 'Grants the user full administrative rights over the wiki, including managing permissions and settings.'